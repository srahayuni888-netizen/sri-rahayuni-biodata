<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Foto profil Sri Rahayuni">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f7fb"/>
      <stop offset="55%" stop-color="#e9e9f1"/>
      <stop offset="100%" stop-color="#f4cfd8"/>
    </linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a45"/>
      <stop offset="100%" stop-color="#22222b"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecb0c1"/>
      <stop offset="100%" stop-color="#3a9387"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="168" fill="none" stroke="url(#ring)" stroke-width="6" opacity=".65"/>

  <!-- Siluet formal -->
  <g opacity=".92">
    <circle cx="200" cy="150" r="58" fill="#c9c9d6"/>
    <path d="M92 340c0-58 48-96 108-96s108 38 108 96z" fill="url(#suit)"/>
    <path d="M200 244l-24 34 24 20 24-20z" fill="#fff" opacity=".92"/>
    <path d="M200 244l-16 14 16 44 16-44z" fill="#de8ea6"/>
  </g>

  <!-- Inisial sebagai ganti foto -->
  <g>
    <rect x="140" y="286" width="120" height="44" rx="22" fill="#2f2f38" opacity=".92"/>
    <text x="200" y="316" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#f4cfd8" text-anchor="middle">SRI RAHAYUNI</text>
  </g>
</svg>
